name: comcolapp
description: "Detector de comida colombiana con información nutricional estimada."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  camera: ^0.11.2+1
  tflite_flutter: ^0.12.1
  yaml: ^3.1.3
  get_it: ^8.3.0
  injectable: ^2.5.1
  go_router: ^17.0.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  injectable_generator: ^2.8.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/models/
